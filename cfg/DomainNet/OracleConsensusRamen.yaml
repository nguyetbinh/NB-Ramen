max_capacity: 300
topk: 10
beta: 5.0
oracle_ood_source: evaluator_is_ood

optimizer: signsgd
lr: 0.01

# The evaluator-only upper bound alters ID support admission only; ordinary
# ConsensusRamen aggregation remains pinned to this exact v0 surface.
consensus_threshold: 0.2
min_consensus_classes: 3
consensus_mode: hard_mask
include_current: true

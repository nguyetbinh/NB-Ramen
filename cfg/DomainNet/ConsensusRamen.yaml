max_capacity: 300
topk: 10
beta: 5.0

optimizer: signsgd
lr: 0.01

# Locked ConsensusRamen-v0 surface, matched to DomainNet/Ramen capacity and
# retrieval settings.  It is not tuned on any DomainNet open-set stream.
consensus_threshold: 0.2
min_consensus_classes: 3
consensus_mode: hard_mask
include_current: true
